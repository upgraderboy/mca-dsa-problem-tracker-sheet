name: Validate Tracker

on:
  push:
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
        working-directory: dsa-tracker

      - name: Validate metadata
        run: python -m scripts.dsa_tracker validate-metadata
        working-directory: dsa-tracker

      - name: Run tests
        run: pytest
        working-directory: dsa-tracker

      - name: Regenerate dashboards
        run: python -m scripts.dsa_tracker generate-dashboards --as-of 2026-01-01
        working-directory: dsa-tracker

      - name: Verify dashboards are up to date
        run: git diff --exit-code
